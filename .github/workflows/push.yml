name: push

on:
  push:
    branches: [main]

jobs:
  test-release:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Test 📱
        run: bun run test
      - run: |
          cd documentation
          bun install
          bun rsbuild build
      - name: 🚀 Publish Demo
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: publish
          folder: documentation/dist
      - uses: tobua/release-npm-action@v3
        with:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
